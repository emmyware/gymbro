# TEST build - no Apple account needed. Upload to repo root as codemagic.yaml
# (rename the real one first), run the test, then restore the real yaml.
workflows:
  gymbro-test:
    name: GymBro iOS Test Build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web app and sync Capacitor iOS project
        script: |
          npm run build || npx vite build
          npx cap add ios
          npx cap sync ios
      - name: Archive iOS project (unsigned)
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App --no-codesign || xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
